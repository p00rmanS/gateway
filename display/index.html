<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E4EFEB; --bg2:#D3E5DF; --ink:#0E2E2C; --soft:#41625E; --accent:#B8640F; --line:#0E2E2C22;
  --font:"Bricolage Grotesque","Noto Sans JP","Noto Sans KR","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E2E2C;--bg2:#0A2422;--ink:#F3F6F4;--soft:#9CC4BA;--accent:#F2B544;--line:#F3F6F422;}
}
:root[data-theme="dark"]{--bg:#0E2E2C;--bg2:#0A2422;--ink:#F3F6F4;--soft:#9CC4BA;--accent:#F2B544;--line:#F3F6F422;}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:radial-gradient(120% 90% at 100% 0%,var(--bg2),var(--bg) 60%);
  color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
.stage{
  height:100%;display:grid;
  grid-template-columns:1.15fr 1fr;grid-template-rows:1fr auto;
  gap:clamp(16px,3vw,48px);padding:clamp(20px,4vw,64px) clamp(20px,5vw,80px) clamp(16px,2.5vw,36px);
}
/* ---- message side ---- */
.msg{align-self:center;min-width:0}
.msg-inner{transition:opacity .45s ease, transform .45s ease, filter .45s ease}
.msg-inner.out{opacity:0;transform:translateY(10px);filter:blur(4px)}
.title{
  font-weight:800;font-size:clamp(30px,5.2vw,84px);line-height:1.02;letter-spacing:-.02em;
  margin:0 0 .35em;text-wrap:balance;
}
.lead{font-size:clamp(16px,1.8vw,28px);line-height:1.4;color:var(--soft);margin:0 0 1.4em;max-width:44ch}
.items{list-style:none;margin:0;padding:0;display:grid;gap:clamp(10px,1.4vw,20px)}
.items li{display:flex;align-items:center;gap:.8em;font-size:clamp(17px,2vw,32px);font-weight:600;line-height:1.2}
.items svg{flex:0 0 auto;width:1.5em;height:1.5em;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:lang(zh-Hans){font-family:"Noto Sans SC",var(--font)}
:lang(zh-Hant){font-family:"Noto Sans TC",var(--font)}
:lang(ko){font-family:"Noto Sans KR",var(--font)}
:lang(ja){font-family:"Noto Sans JP",var(--font)}
:lang(th){font-family:"Noto Sans Thai",var(--font)}
:lang(ar){font-family:"Noto Sans Arabic",var(--font)}
:lang(th) .title,:lang(ar) .title{letter-spacing:0;line-height:1.3}
:is([dir="rtl"]) .items li:nth-child(2) svg{transform:scaleX(-1)}
:lang(th) .lead,:lang(ar) .lead{line-height:1.6}
:lang(ja) .title,:lang(ko) .title,:lang(zh-Hans) .title,:lang(zh-Hant) .title{letter-spacing:0;line-height:1.2}

/* ---- QR side ---- */
.qr-wrap{align-self:center;justify-self:center;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.qr{
  position:relative;background:#fff;border-radius:28px;padding:clamp(14px,1.6vw,26px);
  width:min(100%, 64vh, 520px);aspect-ratio:1;
  box-shadow:0 0 0 6px var(--accent), 0 30px 60px -20px #0006;
}
.qr img{display:block;width:100%;height:100%;image-rendering:pixelated}
.scan{position:absolute;inset:clamp(14px,1.6vw,26px);overflow:hidden;pointer-events:none}
.scan::after{
  content:"";position:absolute;left:-4%;right:-4%;top:-25%;
  background:linear-gradient(to bottom,transparent,color-mix(in srgb,#F2B544 18%,transparent) 92%,#F2B544 100%);height:12%;
  animation:sweep 3.2s cubic-bezier(.5,0,.5,1) infinite;
}
@keyframes sweep{0%{top:-25%}55%{top:100%}100%{top:100%}}
.cam{display:flex;align-items:center;gap:.5em;color:var(--soft);font-size:clamp(14px,1.4vw,20px);font-weight:600}
.cam svg{width:1.4em;height:1.4em;stroke:currentColor;fill:none;stroke-width:1.8}

/* ---- language strip ---- */
.langs{
  grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  border-top:1px solid var(--line);padding-top:clamp(12px,1.6vw,22px);
}
.langs button{
  position:relative;overflow:hidden;font:inherit;font-size:clamp(13px,1.25vw,18px);font-weight:600;
  color:var(--soft);background:transparent;border:1.5px solid var(--line);border-radius:999px;
  padding:.45em 1em;cursor:pointer;
}
.langs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.langs button.on{color:var(--bg);border-color:var(--ink);background:var(--ink)}
.langs button.on::after{
  content:"";position:absolute;left:0;bottom:0;height:3px;background:var(--accent);

const $ = id => document.getElementById(id);
const msg=$("msg"), strip=$("langs");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
document.documentElement.style.setProperty("--dur", SECONDS_PER_LANGUAGE+"s");

let idx=0, timer=null, paintTimer=null;
const buttons = LANGS.map((L,n)=>{
  const b=document.createElement("button");
  b.textContent=L.name; b.lang=L.code;
  b.addEventListener("click",()=>{show(n,true);});
  strip.appendChild(b); return b;
});

function paint(L){
  msg.lang=L.code; msg.dir=L.dir||"ltr";
  $("title").textContent=L.title;
  const ld=$("lead"); ld.replaceChildren(); L.lead.forEach((t,k)=>{if(k)ld.appendChild(document.createElement("br")); ld.appendChild(document.createTextNode(t));});
  ["i1","i2","i3"].forEach((id,k)=>$(id).textContent=L.i[k]);
}
function show(n,held){
  clearTimeout(timer); clearTimeout(paintTimer);
  idx=n;
  buttons.forEach((b,k)=>{b.classList.toggle("on",k===n);b.classList.toggle("held",!!held&&k===n);
    if(k===n){b.classList.remove("on");void b.offsetWidth;b.classList.add("on");}});
  msg.classList.add("out");
  paintTimer=setTimeout(()=>{paint(LANGS[n]);msg.classList.remove("out");}, reduce?150:450);
  timer=setTimeout(()=>show((idx+1)%LANGS.length,false),(held?PAUSE_AFTER_TAP:SECONDS_PER_LANGUAGE)*1000);
}
paint(LANGS[0]); show(0,false);

/* Keep the tablet screen awake where the browser allows it */
let lock=null;
async function keepAwake(){try{if("wakeLock" in navigator&&!lock){lock=await navigator.wakeLock.request("screen");lock.addEventListener("release",()=>lock=null);}}catch(e){}}
keepAwake();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")keepAwake();});
document.addEventListener("pointerdown",keepAwake);
</script>
