<style>
:root{
  --bg:#0E2E2C; --bg2:#0A2422; --ink:#F3F6F4; --soft:#9CC4BA; --accent:#F2B544; --line:rgba(243,246,244,.14);
  --panel:rgba(243,246,244,.08);
  --font:"Bricolage Grotesque","Noto Sans JP","Noto Sans KR","Noto Sans SC","Noto Sans","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="light"]{
  --bg:#E4EFEB; --bg2:#D3E5DF; --ink:#0E2E2C; --soft:#41625E; --accent:#B8640F; --line:rgba(14,46,44,.16);
  --panel:rgba(14,46,44,.08);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  height:100vh;height:100dvh;
  background:var(--bg);background:radial-gradient(120% 90% at 100% 0%,var(--bg2),var(--bg) 60%);
  color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  touch-action:manipulation;
}
.stage{
  height:100%;display:grid;--qrh:64vh;
  grid-template-columns:1.15fr 1fr;grid-template-rows:minmax(0,1fr) auto auto;
  gap:clamp(12px,2.4vw,40px);
  padding:max(clamp(18px,3.4vw,56px),env(safe-area-inset-top)) max(clamp(20px,5vw,80px),env(safe-area-inset-right)) max(clamp(14px,2.2vw,32px),env(safe-area-inset-bottom)) max(clamp(20px,5vw,80px),env(safe-area-inset-left));
}
.stage.has-busy{--qrh:44vh;--qrhp:30vh;gap:clamp(10px,1.6vw,26px)}

/* ---- message ---- */
.msg{align-self:center;min-width:0}
.msg-inner{transition:opacity .45s ease, transform .45s ease, filter .45s ease}
.msg-inner.out,.busy.out{opacity:0;transform:translateY(10px);-webkit-filter:blur(4px);filter:blur(4px)}
.title{
  font-weight:800;font-size:calc(clamp(28px,min(5.2vw,9vh),84px) * var(--k,1));line-height:1.02;letter-spacing:-.02em;
  margin:0 0 .35em;
}
.has-busy .title{font-size:calc(clamp(24px,min(4.2vw,6.6vh),66px) * var(--k,1))}
.lead{font-size:calc(clamp(16px,1.8vw,28px) * var(--k,1));line-height:1.4;color:var(--soft);margin:0 0 1.4em;max-width:44ch}
.has-busy .lead{font-size:calc(clamp(14px,1.5vw,24px) * var(--k,1));margin-bottom:1em}
.items{list-style:none;margin:0;padding:0;display:grid;gap:clamp(10px,1.4vw,20px)}
.items li{display:flex;align-items:center;gap:.8em;font-size:calc(clamp(17px,2vw,32px) * var(--k,1));font-weight:600;line-height:1.2}
.has-busy .items{gap:clamp(6px,1vw,14px)}
.has-busy .items li{font-size:calc(clamp(15px,1.7vw,27px) * var(--k,1))}
.items svg{flex:0 0 auto;width:1.5em;height:1.5em;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .items li:nth-child(2) svg{transform:scaleX(-1)}

/* per-language fonts and spacing */
:lang(zh-Hans){font-family:"Noto Sans SC",var(--font)}
:lang(zh-Hant){font-family:"Noto Sans TC",var(--font)}
:lang(ko){font-family:"Noto Sans KR",var(--font)}
:lang(ja){font-family:"Noto Sans JP",var(--font)}
:lang(th){font-family:"Noto Sans Thai",var(--font)}
:lang(ar){font-family:"Noto Sans Arabic",var(--font)}
:lang(ru),:lang(sr),:lang(mn){font-family:"Noto Sans",var(--font)}
:lang(hi){font-family:"Noto Sans Devanagari","Noto Sans",var(--font)}
:lang(th) .title,:lang(ar) .title,:lang(hi) .title{letter-spacing:0;line-height:1.3}
:lang(th) .lead,:lang(ar) .lead,:lang(hi) .lead{line-height:1.6}
:lang(ja) .title,:lang(ko) .title,:lang(zh-Hans) .title,:lang(zh-Hant) .title{letter-spacing:0;line-height:1.2}
:lang(ru) .title,:lang(sr) .title,:lang(mn) .title{letter-spacing:0}

/* ---- QR ---- */
.qr-wrap{align-self:center;justify-self:center;width:100%;display:flex;justify-content:center;min-height:0}
.qr{
  position:relative;background:#fff;border-radius:28px;padding:clamp(14px,1.6vw,26px);
  width:min(100%, var(--qrh), 520px);
  box-shadow:0 0 0 6px var(--accent), 0 30px 60px -20px rgba(0,0,0,.4);
}
.qr img{display:block;width:100%;height:auto;image-rendering:pixelated}
.scan{position:absolute;top:clamp(14px,1.6vw,26px);right:clamp(14px,1.6vw,26px);bottom:clamp(14px,1.6vw,26px);left:clamp(14px,1.6vw,26px);overflow:hidden;pointer-events:none}
.scan::after{
  content:"";position:absolute;left:-4%;right:-4%;top:-25%;height:12%;
  background:linear-gradient(to bottom,rgba(242,181,68,0),rgba(242,181,68,.18) 92%,#F2B544 100%);
  animation:sweep 3.2s cubic-bezier(.5,0,.5,1) infinite;
}
@keyframes sweep{0%{top:-25%}55%{top:100%}100%{top:100%}}

/* ---- busy notice: soft panel, no border ---- */
.busy{
  grid-column:1/-1;background:var(--panel);border-radius:18px;
  padding:clamp(10px,1.2vw,18px) clamp(16px,2.2vw,32px);
  display:flex;align-items:center;gap:clamp(12px,1.8vw,26px);min-width:0;
  transition:opacity .45s ease, transform .45s ease, filter .45s ease;
}
.busy[hidden]{display:none}
.busy>svg{flex:0 0 auto;width:clamp(24px,2.4vw,38px);height:clamp(24px,2.4vw,38px);stroke:var(--soft);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.busy>div{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,.34fr) minmax(0,1fr);gap:clamp(12px,2.2vw,36px);align-items:center}
.busy strong{font-weight:800;font-size:clamp(17px,2.1vw,32px);line-height:1.2}
.busy p{margin:0;font-weight:500;font-size:clamp(12px,1.3vw,20px);line-height:1.4;color:var(--ink)}
:lang(th) .busy p,:lang(ar) .busy p,:lang(hi) .busy p{line-height:1.6}

/* ---- language strip ---- */
.langs{
  grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  border-top:1px solid var(--line);padding-top:clamp(10px,1.4vw,20px);
}
.langs button{
  position:relative;overflow:hidden;font:inherit;font-size:clamp(13px,1.2vw,17px);font-weight:600;line-height:1.1;
  min-height:44px;padding:0 1.1em;color:var(--soft);background:transparent;
  border:1.5px solid var(--line);border-radius:999px;cursor:pointer;
  -webkit-appearance:none;appearance:none;touch-action:manipulation;
}
.langs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.langs button.on{color:var(--bg);border-color:var(--ink);background:var(--ink)}
.langs button.on::after{
  content:"";position:absolute;left:0;bottom:0;height:3px;background:var(--accent);
  width:0;animation:fill var(--dur,6s) linear forwards;
}
.langs button.on.held::after{animation:none;width:100%}
@keyframes fill{to{width:100%}}

/* ---- staff toast ---- */
.toast{
  position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;padding:10px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .25s ease;white-space:nowrap;
}
.toast.show{opacity:1}

@media (orientation:portrait){
  .stage{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto auto;text-align:center}
  .qr-wrap{order:-1}
  .qr{width:min(78vw,var(--qrhp,44vh),520px)}
  .lead{margin-inline:auto}
  .items{justify-content:center}
  .items li{justify-content:center}
  .busy>div{grid-template-columns:1fr;gap:.3em}
  .busy{text-align:start}
  .busy p{font-size:clamp(12px,1.9vw,17px)}
}
@media (prefers-reduced-motion:reduce){
  .scan::after{animation:none;display:none}
  .msg-inner,.busy{transition:opacity .3s}
  .msg-inner.out,.busy.out{transform:none;-webkit-filter:none;filter:none}
}
</style>
</head>

 "pt":{t:"Aloha! Obrigado pela sua paciência",p:["Estamos recebendo muitos convidados neste momento, por isso a espera por uma mesa pode ser um pouco maior do que o normal.","Nossa equipe atenderá você assim que possível. Enquanto isso, fique à vontade para explorar nosso Guia do Visitante e descobrir mais coisas para aproveitar durante sua visita.","Mahalo pela sua paciência e compreensão. Estamos ansiosos para atender você!"],ok:"Entendi"},
 "fr":{t:"Aloha ! Merci de votre patience",p:["Nous accueillons de nombreux convives en ce moment ; l’attente pour être installé peut donc être un peu plus longue que d’habitude.","Notre équipe sera à vous dès que possible. En attendant, n’hésitez pas à découvrir notre Guide des invités et à explorer d’autres moments à savourer pendant votre visite.","Mahalo pour votre patience et votre compréhension. Nous avons hâte de vous servir !"],ok:"Compris"},
 "de":{t:"Aloha! Vielen Dank für Ihre Geduld",p:["Zurzeit begrüßen wir viele Gäste, daher kann die Platzzuweisung etwas länger dauern als gewöhnlich.","Unser Team ist so schnell wie möglich für Sie da. Entdecken Sie in der Zwischenzeit gern unseren Gästeguide und finden Sie weitere schöne Dinge für Ihren Besuch.","Mahalo für Ihre Geduld und Ihr Verständnis. Wir freuen uns darauf, Sie zu bedienen!"],ok:"Verstanden"},
 "nl":{t:"Aloha! Bedankt voor uw geduld",p:["Op dit moment verwelkomen we veel gasten, dus het kan iets langer duren dan normaal voordat u een plaats krijgt.","Ons team is zo snel mogelijk bij u. Bekijk in de tussentijd gerust onze Gastengids en ontdek meer dingen om van te genieten tijdens uw bezoek.","Mahalo voor uw geduld en begrip. We kijken ernaar uit u te mogen bedienen!"],ok:"Begrepen"},
 "vi":{t:"Aloha! Cảm ơn quý khách đã kiên nhẫn",p:["Hiện chúng tôi đang đón rất nhiều khách nên việc sắp xếp chỗ ngồi có thể lâu hơn bình thường một chút.","Đội ngũ của chúng tôi sẽ phục vụ quý khách ngay khi có thể. Trong lúc chờ, mời quý khách khám phá Hướng dẫn dành cho khách và tìm hiểu thêm nhiều điều thú vị trong chuyến tham quan.","Mahalo vì sự kiên nhẫn và thông cảm của quý khách. Chúng tôi rất mong được phục vụ quý khách!"],ok:"Đã hiểu"},
 "zh-Hans":{t:"Aloha！感谢您的耐心等待",p:["目前宾客较多，入座可能需要比平时稍长的时间。","我们的团队会尽快为您服务。在此期间，欢迎浏览我们的宾客指南，发现更多精彩体验。","Mahalo，感谢您的耐心与理解，期待为您服务！"],ok:"知道了"},
 "zh-Hant":{t:"Aloha！感謝您的耐心等候",p:["目前賓客較多，入座可能需要比平時稍長的時間。","我們的團隊會盡快為您服務。在此期間，歡迎瀏覽我們的賓客指南，發現更多精彩體驗。","Mahalo，感謝您的耐心與體諒，期待為您服務！"],ok:"知道了"},
 "ko":{t:"Aloha! 기다려 주셔서 감사합니다",p:["현재 많은 손님이 방문해 주셔서 좌석 안내가 평소보다 다소 늦어질 수 있습니다.","저희 직원이 최대한 빨리 안내해 드리겠습니다. 기다리시는 동안 게스트 가이드를 살펴보시고 방문 중 즐길 거리를 더 찾아보세요.","기다려 주시고 이해해 주셔서 감사합니다(Mahalo). 곧 모시겠습니다!"],ok:"확인"},
 "ja":{t:"Aloha！お待ちいただきありがとうございます",p:["ただいま多くのお客様にご来店いただいており、ご案内までいつもより少しお時間をいただく場合がございます。","スタッフが順番にご案内いたしますので、今しばらくお待ちください。お待ちの間は、ゲストガイドをご覧いただき、ご滞在中のお楽しみをぜひ見つけてください。","ご理解とご協力に Mahalo（ありがとうございます）。お客様をお迎えできることを楽しみにしております！"],ok:"OK"},
 "da":{t:"Aloha! Tak for din tålmodighed",p:["Vi byder mange gæster velkommen i øjeblikket, så det kan tage lidt længere tid end normalt at få et bord.","Vores team er hos dig så hurtigt som muligt. Imens er du velkommen til at udforske vores Gæstguide og opdage flere ting at nyde under dit besøg.","Mahalo for din tålmodighed og forståelse. Vi glæder os til at tage imod dig!"],ok:"Forstået"},
 "sr":{t:"Aloha! Хвала на стрпљењу",p:["Тренутно дочекујемо много гостију, па чекање на сто може потрајати нешто дуже него обично.","Наш тим ће бити уз вас што је пре могуће. У међувремену, слободно истражите наш Водич за госте и откријте још ствари у којима можете уживати током посете.","Mahalo на стрпљењу и разумевању. Радујемо се што ћемо вам служити!"],ok:"У реду"},
 "ar":{t:"ألوها! شكرًا لصبركم",p:["نستقبل عددًا كبيرًا من الضيوف في الوقت الحالي، لذا قد يستغرق الحصول على مقعد وقتًا أطول قليلًا من المعتاد.","سيكون فريقنا معكم في أقرب وقت ممكن. وفي الأثناء، يسعدنا أن تتصفحوا دليل الضيوف لدينا وتكتشفوا المزيد من الأشياء الممتعة خلال زيارتكم.","ماهالو على صبركم وتفهّمكم. نتطلع إلى خدمتكم!"],ok:"حسنًا"},
 "it":{t:"Aloha! Grazie per la pazienza",p:["In questo momento stiamo accogliendo molti ospiti, quindi l’attesa per un tavolo potrebbe essere un po’ più lunga del solito.","Il nostro team sarà da voi il prima possibile. Nel frattempo, vi invitiamo a sfogliare la nostra Guida per gli ospiti e a scoprire altre cose da vivere durante la vostra visita.","Mahalo per la vostra pazienza e comprensione. Non vediamo l’ora di servirvi!"],ok:"Capito"},
 "th":{t:"Aloha! ขอบคุณที่รอคอย",p:["ขณะนี้มีแขกจำนวนมาก การจัดที่นั่งอาจใช้เวลานานกว่าปกติเล็กน้อย","ทีมงานของเราจะดูแลท่านโดยเร็วที่สุด ระหว่างนี้ ท่านสามารถดูคู่มือสำหรับแขกของเรา และค้นพบสิ่งน่าสนุกอื่น ๆ ระหว่างการมาเยือนได้เลย","Mahalo สำหรับความอดทนและความเข้าใจของท่าน เรารอคอยที่จะให้บริการท่าน!"],ok:"รับทราบ"},
 "ru":{t:"Aloha! Спасибо за ваше терпение",p:["Сейчас у нас много гостей, поэтому ожидание места может занять немного больше времени, чем обычно.","Наша команда подойдёт к вам как можно скорее. А пока вы можете изучить наш Гид для гостей и найти ещё больше интересного во время вашего визита.","Mahalo за ваше терпение и понимание. Мы с нетерпением ждём возможности вас обслужить!"],ok:"Понятно"},
 "hi":{t:"Aloha! आपके धैर्य के लिए धन्यवाद",p:["इस समय हमारे यहाँ बहुत से मेहमान हैं, इसलिए बैठने की जगह मिलने में सामान्य से थोड़ा अधिक समय लग सकता है।","हमारी टीम जल्द से जल्द आपकी सेवा में उपस्थित होगी। तब तक, हमारी गेस्ट गाइड देखें और अपनी यात्रा के दौरान आनंद लेने के लिए और भी बहुत कुछ जानें।","आपके धैर्य और समझ के लिए Mahalo। हम आपकी सेवा करने के लिए उत्सुक हैं!"],ok:"ठीक है"},
 "mn":{t:"Aloha! Тэвчээрийг тань үнэлж байна",p:["Одоогоор олон зочин ирсэн тул суудал хүлээх хугацаа ердийнхөөс арай урт байж магадгүй.","Манай баг аль болох хурдан танд үйлчилнэ. Энэ хооронд манай Зочдын гарын авлагыг үзэж, айлчлалынхаа үеэр баярлан эдлэх бусад зүйлийг нээгээрэй.","Тэвчээр, ойлголцолд тань Mahalo. Танд үйлчлэхийг тэсэн ядан хүлээж байна!"],ok:"Ойлголоо"}
};

const $ = id => document.getElementById(id);
const msg=$("msg"), strip=$("langs"), busy=$("busy"), stage=$("stage"), toast=$("toast");
const fade=[msg,busy];
const reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const params = new URLSearchParams(location.search);

/* theme: green (dark) unless ?theme=light, so every device looks the same */
document.documentElement.setAttribute("data-theme", params.get("theme")==="light" ? "light" : "dark");
document.documentElement.style.setProperty("--dur", SECONDS_PER_LANGUAGE+"s");

/* ---- busy switch (remembered per device; storage may be blocked, so never rely on it) ---- */
const BUSY_KEY="gw_busy";
const store={
  get(){try{return localStorage.getItem(BUSY_KEY);}catch(e){return null;}},
  set(v){try{localStorage.setItem(BUSY_KEY,v);}catch(e){}}
};
let busyOn = BUSY_DEFAULT_ON;
(function(){
  const q=params.get("busy"); if(q==="on"||q==="off") store.set(q);
  const v = (q==="on"||q==="off") ? q : store.get();
  if(v==="on") busyOn=true; else if(v==="off") busyOn=false;
})();
let toastTimer=null;
function say(text){ toast.textContent=text; toast.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove("show"),2200); }
/* Shrink the text block until it fits its space, so no language or screen shape can overlap the QR code or buttons. */
function fit(){
  const portrait = matchMedia("(orientation: portrait)").matches;
  const sc = getComputedStyle(stage), gap = parseFloat(sc.rowGap)||0;
  const top = portrait ? document.querySelector(".qr-wrap").getBoundingClientRect().bottom + gap : parseFloat(sc.paddingTop)||0;
  const bottom = (busy.hidden ? strip : busy).getBoundingClientRect().top - gap;
  const avail = bottom - top;
  let k = 1; msg.style.setProperty("--k", 1);
  for(let i=0;i<14 && k>0.45 && msg.getBoundingClientRect().height > avail;i++){ k*=0.93; msg.style.setProperty("--k", k.toFixed(3)); }
}
function applyBusy(){ busy.hidden=!busyOn; stage.classList.toggle("has-busy",busyOn); if(typeof fit==="function"&&LANGS) fit(); }
function toggleBusy(){ busyOn=!busyOn; store.set(busyOn?"on":"off"); applyBusy(); say("Busy notice: "+(busyOn?"ON":"OFF")); }
applyBusy();

/* press and hold the headline for 1 second */
(function(){
  let t=null, x=0, y=0;
  const stop=()=>{clearTimeout(t);t=null;};
  msg.addEventListener("pointerdown",e=>{x=e.clientX;y=e.clientY;stop();t=setTimeout(()=>{t=null;toggleBusy();},1000);});
  msg.addEventListener("pointermove",e=>{if(t&&Math.abs(e.clientX-x)+Math.abs(e.clientY-y)>14)stop();});
  ["pointerup","pointercancel","pointerleave"].forEach(n=>msg.addEventListener(n,stop));
  msg.addEventListener("contextmenu",e=>e.preventDefault());
  document.addEventListener("keydown",e=>{ if((e.key==="b"||e.key==="B")&&!e.ctrlKey&&!e.metaKey&&!e.altKey) toggleBusy(); });
})();

/* ---- language rotation ---- */
let idx=0, timer=null, paintTimer=null;
const buttons = LANGS.map((L,n)=>{
  const b=document.createElement("button");
  b.type="button"; b.textContent=L.name; b.lang=L.code;
  b.addEventListener("click",()=>show(n,true));
  strip.appendChild(b); return b;
});

function paint(L){
  msg.lang=L.code; msg.dir=L.dir||"ltr";
  $("title").textContent=L.title;
  const ld=$("lead"); while(ld.firstChild) ld.removeChild(ld.firstChild);
  L.lead.forEach((t,k)=>{if(k)ld.appendChild(document.createElement("br")); ld.appendChild(document.createTextNode(t));});
  ["i1","i2","i3"].forEach((id,k)=>$(id).textContent=L.i[k]);
  const N=NOTICE[L.code]||NOTICE.en, ok=!!NOTICE[L.code];
  busy.lang=ok?L.code:"en"; busy.dir=ok?(L.dir||"ltr"):"ltr";
  $("busyT").textContent=N.t; $("busyP").textContent=N.p.join(" ");
  fit();
}
function show(n,held){
  clearTimeout(timer); clearTimeout(paintTimer);
  idx=n;
  buttons.forEach((b,k)=>{b.classList.toggle("held",!!held&&k===n);b.classList.toggle("on",k===n);if(k===n){b.classList.remove("on");void b.offsetWidth;b.classList.add("on");}});
  fade.forEach(x=>x.classList.add("out"));
  paintTimer=setTimeout(()=>{paint(LANGS[n]);fade.forEach(x=>x.classList.remove("out"));}, reduce?0:300);
  timer=setTimeout(()=>show((idx+1)%LANGS.length,false),(held?PAUSE_AFTER_TAP:SECONDS_PER_LANGUAGE)*1000);
}
paint(LANGS[0]); show(0,false);
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",()=>setTimeout(fit,250));
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);

/* ---- keep the screen awake where the browser allows it ---- */
let lock=null;
async function keepAwake(){try{if("wakeLock" in navigator&&!lock){lock=await navigator.wakeLock.request("screen");lock.addEventListener("release",()=>{lock=null;});}}catch(e){}}
keepAwake();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")keepAwake();});
document.addEventListener("pointerdown",keepAwake);
</script>
</body>
</html>
